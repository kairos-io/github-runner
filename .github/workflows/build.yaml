name: Build the github runner image and push to quay.io

on:
  push:
    branches: [ main ]

jobs:

  build:

    runs-on: ubuntu-latest
    env:
      DOCKER_REGISTRY: quay.io
      DOCKER_IMAGE: kairos/github-runner
      DOCKER_TARGET_PLATFORM: "linux/arm64,linux/amd64"

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: crazy-max/ghaction-docker-buildx@v1
      with:
        version: latest

    - name: Login to Quay Registry
      env:
        QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
        QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
      run: |
        missing=""
        [ -n "${QUAY_USERNAME}" ] || missing="QUAY_USERNAME"
        [ -n "${QUAY_PASSWORD}" ] || missing="${missing:+${missing} and }QUAY_PASSWORD"
        if [ -n "${missing}" ]; then
          echo "::error::${DOCKER_REGISTRY}/${DOCKER_IMAGE} cannot be pushed: no value for ${missing} in this repository. The quay secrets are not scoped to kairos-io/github-runner. See kairos-io/kairos#5128."
          exit 1
        fi
        printf %s "${QUAY_PASSWORD}" | docker login -u "${QUAY_USERNAME}" --password-stdin "${DOCKER_REGISTRY}"

    - name: Run Buildx
      run: |
        docker buildx build --platform ${DOCKER_TARGET_PLATFORM} --tag ${DOCKER_REGISTRY}/${DOCKER_IMAGE}:latest --file ./Dockerfile --output type=image,push=true .